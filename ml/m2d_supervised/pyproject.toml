[project]
name = "baby-care-m2d-supervised"
version = "1.2.0"
description = "Fixed M2D development comparison, final retraining, sealed evaluation and export"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.4.6",
    "torch==2.14.0",
    "timm==1.0.29",
]

[project.optional-dependencies]
inference = [
    "nnAudio==0.3.4",
    "soundfile==0.13.1",
    "soxr==1.0.0",
]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[project.scripts]
m2d-supervised = "m2d_supervised.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"
