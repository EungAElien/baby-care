# Copy to .artifacts/deployment/cloud-run.env.yaml and replace the origins.
# Credentials belong in Secret Manager, never in this file.
BABY_CARE_ENVIRONMENT: "staging"
BABY_CARE_HOST: "0.0.0.0"
BABY_CARE_PORT: "8080"
BABY_CARE_LOG_LEVEL: "INFO"
BABY_CARE_BROWSER_ORIGINS: "https://baby-care-demo.vercel.app"
BABY_CARE_INVITE_BASE_URL: "https://baby-care-demo.vercel.app/invite"
BABY_CARE_CHILD_DATA_PRODUCTION_ENABLED: "false"
BABY_CARE_EXTERNAL_NORMALIZATION_ENABLED: "false"
BABY_CARE_M2D_ENABLED: "false"
