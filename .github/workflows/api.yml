name: API checks

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "contracts/openapi계약.json"
      - "contracts/목 응답과 시험 사용자 배치.json"
      - ".github/workflows/api.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "contracts/openapi계약.json"
      - "contracts/목 응답과 시험 사용자 배치.json"
      - ".github/workflows/api.yml"

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes --no-deps -r apps/api/requirements-dev.lock

      - name: Check formatting
        working-directory: apps/api
        run: python -m ruff format --check src tests

      - name: Lint
        working-directory: apps/api
        run: python -m ruff check src tests

      - name: Type check
        working-directory: apps/api
        run: python -m mypy src

      - name: Test
        working-directory: apps/api
        run: python -m pytest

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build image without pushing
        run: docker build --pull --tag baby-care-api:ci apps/api

      - name: Smoke-test liveness and fail-closed readiness
        run: |
          docker run --detach --name baby-care-api-ci --publish 18080:8080 baby-care-api:ci
          trap 'docker rm --force baby-care-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:18080/health/live >/tmp/liveness.json; then
              break
            fi
            sleep 1
          done
          test "$(python -c 'import json; print(json.load(open("/tmp/liveness.json"))["status"])')" = "ok"
          readiness_status="$(curl --silent --output /tmp/readiness.json --write-out '%{http_code}' http://127.0.0.1:18080/health/ready)"
          test "$readiness_status" = "503"
          test "$(python -c 'import json; print(json.load(open("/tmp/readiness.json"))["status"])')" = "not_ready"
