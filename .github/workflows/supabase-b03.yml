name: Supabase B-03

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/test-supabase-*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/supabase-b03.yml"
  push:
    branches: [develop]
    paths:
      - "supabase/**"
      - "scripts/test-supabase-*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/supabase-b03.yml"

permissions:
  contents: read

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:supabase
      - if: always()
        run: npm run supabase:stop
