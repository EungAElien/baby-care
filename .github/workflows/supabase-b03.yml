name: Supabase B-03

on:
  pull_request:
    paths:
      - "supabase/**"
      - "apps/api/**"
      - "scripts/test-supabase-*"
      - "scripts/test-api-postgres-authorization.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/supabase-b03.yml"
  push:
    branches: [develop]
    paths:
      - "supabase/**"
      - "apps/api/**"
      - "scripts/test-supabase-*"
      - "scripts/test-api-postgres-authorization.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/supabase-b03.yml"

permissions:
  contents: read

jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install --require-hashes --no-deps -r apps/api/requirements-dev.lock
      - run: npm ci
      - run: npm run test:supabase
        env:
          API_PYTHON: python
      - if: always()
        run: npm run supabase:stop
