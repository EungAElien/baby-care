name: B-13 verification

"on":
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:
    types: [checks_requested]

# Fork pull requests run only local synthetic checks. No deployment or production secrets are used.
permissions:
  contents: read

concurrency:
  group: b13-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested merge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-dev.lock
            contracts/requirements.lock

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes --no-deps -r apps/api/requirements-dev.lock
          python -m pip install --require-hashes --no-deps -r contracts/requirements.lock

      - name: Install locked Node dependencies
        run: |
          npm ci
          npm --prefix apps/web ci

      - name: Run contract, API, and web checks
        env:
          API_PYTHON: python
        run: npm run verify:quick

      - name: Recheck artifact safety before upload
        id: artifact_safety
        if: ${{ always() }}
        run: python scripts/verification/scan_sensitive.py .artifacts/verification/

      - name: Upload redacted verification records
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b13-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/verification/
          if-no-files-found: error
          retention-days: 7

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested merge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build and smoke-test the unconfigured image
        run: npm run verify:container

      - name: Recheck artifact safety before upload
        id: artifact_safety
        if: ${{ always() }}
        run: python scripts/verification/scan_sensitive.py .artifacts/verification/

      - name: Upload redacted verification records
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b13-container-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/verification/
          if-no-files-found: error
          retention-days: 7

  local-supabase:
    name: local-supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tested merge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes --no-deps -r apps/api/requirements-dev.lock
          npm ci

      - name: Run isolated Supabase and configured-container integration
        env:
          API_PYTHON: python
        run: npm run verify:integration

      - name: Recheck artifact safety before upload
        id: artifact_safety
        if: ${{ always() }}
        run: python scripts/verification/scan_sensitive.py .artifacts/verification/

      - name: Upload redacted verification records
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b13-local-supabase-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/verification/
          if-no-files-found: error
          retention-days: 7

  failure-detection:
    name: failure-detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested merge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-dev.lock
            contracts/requirements.lock

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --require-hashes --no-deps -r apps/api/requirements-dev.lock
          python -m pip install --require-hashes --no-deps -r contracts/requirements.lock
          npm ci
          npm --prefix apps/web ci

      - name: Prove required failures are detected
        env:
          API_PYTHON: python
        run: npm run verify:failure-detection

      - name: Recheck artifact safety before upload
        id: artifact_safety
        if: ${{ always() }}
        run: python scripts/verification/scan_sensitive.py .artifacts/verification/

      - name: Upload redacted verification records
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b13-failure-detection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/verification/
          if-no-files-found: error
          retention-days: 7

  verification-gate:
    name: B-13 verification gate
    if: ${{ always() }}
    needs: [test, container, local-supabase, failure-detection]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tested merge commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"

      - name: Require every child job to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python scripts/verification/evaluate_ci_results.py \
            --output .artifacts/verification/final-gate/result.json

      - name: Recheck artifact safety before upload
        id: artifact_safety
        if: ${{ always() }}
        run: python scripts/verification/scan_sensitive.py .artifacts/verification/final-gate/

      - name: Upload the final gate record
        if: ${{ always() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b13-verification-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/verification/final-gate/
          if-no-files-found: error
          retention-days: 7
